<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150" role="img" aria-labelledby="fauBadgeTitle">
  <title id="fauBadgeTitle">FAU Owls badge</title>

  <!-- Card backing so the badge stays legible on any background/theme -->
  <rect x="2" y="2" width="116" height="146" rx="16" fill="#ffffff" stroke="#cccccc" stroke-width="1" />

  <!-- Ear tufts -->
  <polygon points="34,24 42,6 48,28" fill="#003366" stroke="#cc0000" stroke-width="3" stroke-linejoin="round" />
  <polygon points="86,24 78,6 72,28" fill="#003366" stroke="#cc0000" stroke-width="3" stroke-linejoin="round" />

  <!-- Badge circle -->
  <circle cx="60" cy="50" r="42" fill="#003366" stroke="#cc0000" stroke-width="5" />
  <circle cx="60" cy="50" r="42" fill="none" stroke="#126bd9" stroke-width="1.5" opacity="0.6" />

  <!-- Eyes -->
  <circle cx="42" cy="49" r="14" fill="#ffffff" />
  <circle cx="78" cy="49" r="14" fill="#ffffff" />
  <circle cx="42" cy="49" r="6.5" fill="#001f3f" />
  <circle cx="78" cy="49" r="6.5" fill="#001f3f" />
  <circle cx="44.2" cy="46.5" r="2" fill="#ffffff" />
  <circle cx="80.2" cy="46.5" r="2" fill="#ffffff" />

  <!-- Beak -->
  <polygon points="60,56 55,65 65,65" fill="#cc0000" />

  <!-- Wordmark (navy/gray on the white card, clear of the circle in every render size) -->
  <text x="60" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="28" fill="#003366">FAU</text>
  <rect x="32" y="125" width="56" height="4" rx="2" fill="#cc0000" />
  <text x="60" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10.5" letter-spacing="1.5" fill="#8a8d8f">OWLS</text>
</svg>
